[moondeck-buddy]
src.github = "FrogTheFrog/moondeck-buddy"
src.prefix = "v"
fetch.url = "https://github.com/FrogTheFrog/moondeck-buddy/releases/download/v$ver/MoonDeckBuddy-$ver-x86_64.AppImage"

[opendeck]
src.github = "nekename/OpenDeck"
src.prefix = "v"
fetch.url = "https://github.com/nekename/OpenDeck/releases/download/v$ver/opendeck_$ver_amd64.AppImage"

[octowow]
src.webpage = "https://dl.octowow.st/launcher-updates/latest.yml"
src.regex = "version: ([0-9.]+)"
fetch.url = "https://dl.octowow.st/launcher-updates/OctoLauncher_Installer-$ver.exe"

[swgr]
src.webpage = "https://patch.swgr.media/patch/launcher/latest.yml"
src.regex = "version: ([0-9.]+)"
fetch.url = "https://patch.swgr.media/patch/launcher/SWG%20Restoration%20Install.exe"
url.name = "swgr-install.exe"

[tlopo]
src.webpage = "https://tlopo.com/play/?update=1"
src.regex = "TLOPO_win64_setup_([0-9.]+)\\.exe"
fetch.url = "https://download.tlopo.com/TLOPO_win64_setup_$ver.exe"

[jacktook]
src.git = "https://github.com/Sam-Max/plugin.video.jacktook.git"
src.branch = "main"
fetch.github = "Sam-Max/plugin.video.jacktook"

[agent-lisp-paren-aid]
src.github = "kiyoka/agent-lisp-paren-aid"
fetch.url = "https://github.com/kiyoka/agent-lisp-paren-aid/releases/download/$ver/agent-lisp-paren-aid-linux"

# Experimental niri HDR fork — https://github.com/niri-wm/niri/discussions/1128
# Source revs only; cargoDeps vendor hash in pkgs/niri-hdr/package.nix is manual.
[niri-hdr]
src.git = "https://github.com/dividebysandwich/niri.git"
src.branch = "hdr-smithay-master"
fetch.github = "dividebysandwich/niri"

[smithay-hdr]
src.git = "https://github.com/dividebysandwich/smithay.git"
src.branch = "ds-hdr-master"
fetch.github = "dividebysandwich/smithay"

# Herdr plugin: source tree (manifest, install scripts) + prebuilt binary,
# both pinned to the same release tag. See modules/home/dev/herdr/default.nix.
[herdr-reviewr]
src.github = "persiyanov/herdr-reviewr"
fetch.github = "persiyanov/herdr-reviewr"

[herdr-reviewr-bin]
src.github = "persiyanov/herdr-reviewr"
fetch.url = "https://github.com/persiyanov/herdr-reviewr/releases/download/$ver/herdr-reviewr-x86_64-unknown-linux-musl.tar.gz"

