---
# Kernel 6.17 has no headers yet - use 6.14 which works with nvidia 550.x
- name: Install Proxmox kernel 6.14 with headers
  ansible.builtin.apt:
    name:
      - proxmox-kernel-6.14
      - proxmox-headers-6.14
    state: present

- name: Pin Proxmox kernel to 6.14 (prevent nvidia breakage on kernel update)
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/proxmox-kernel
    content: |
      # Pin to kernel 6.14 for NVIDIA driver compatibility
      Package: proxmox-kernel-6.17* proxmox-kernel-6.18*
      Pin: version *
      Pin-Priority: -1
    mode: '0644'

- name: Use verified NVIDIA-compatible kernel
  ansible.builtin.set_fact:
    kernel_6_14_version: 6.14.11-5-bpo12-pve

- name: Verify NVIDIA-compatible kernel is installed
  ansible.builtin.stat:
    path: /boot/vmlinuz-{{ kernel_6_14_version }}
  register: kernel_6_14_image
  failed_when: not kernel_6_14_image.stat.exists

# proxmox-boot-tool only drives the boot order on hosts where it manages the
# ESPs (systemd-boot / UEFI). It records those in /etc/kernel/proxmox-boot-uuids;
# without that file 'proxmox-boot-tool kernel pin' just writes an inert
# /etc/kernel/proxmox-boot-pin and GRUB keeps booting whatever GRUB_DEFAULT
# selects. Pick the mechanism that actually applies to this host.
- name: Detect proxmox-boot-tool managed ESPs
  ansible.builtin.stat:
    path: /etc/kernel/proxmox-boot-uuids
  register: proxmox_boot_uuids

- name: Set kernel 6.14 as default boot kernel (proxmox-boot-tool hosts)
  ansible.builtin.command:
    cmd: proxmox-boot-tool kernel pin {{ kernel_6_14_version }}
  register: kernel_pin_result
  changed_when: "'Setting' in kernel_pin_result.stdout"
  when: proxmox_boot_uuids.stat.exists

- name: Refresh boot configuration
  ansible.builtin.command:
    cmd: proxmox-boot-tool refresh
  when:
    - proxmox_boot_uuids.stat.exists
    - kernel_pin_result.changed

# GRUB-booted hosts (e.g. rohan, legacy BIOS): GRUB_DEFAULT=0 boots the newest
# installed kernel, and proxmox-default-kernel keeps pulling 6.17+, which has no
# nvidia 550.x DKMS module. Pin the menu entry for 6.14 explicitly instead.
- name: Get GRUB filesystem UUID for /boot
  ansible.builtin.command:
    cmd: grub-probe --target=fs_uuid /boot
  register: grub_fs_uuid
  changed_when: false
  when: not proxmox_boot_uuids.stat.exists

- name: Pin GRUB default menu entry to kernel 6.14
  ansible.builtin.copy:
    dest: /etc/default/grub.d/proxmox-kernel-pin.cfg
    content: |
      # Managed by Ansible (nvidia-fan-control role).
      # Boot {{ kernel_6_14_version }} explicitly so the nvidia {{ nvidia_driver_version }}
      # DKMS module always matches the running kernel.
      GRUB_DEFAULT="gnulinux-advanced-{{ grub_fs_uuid.stdout }}>gnulinux-{{ kernel_6_14_version }}-advanced-{{ grub_fs_uuid.stdout }}"
    mode: '0644'
  register: grub_kernel_pin
  when: not proxmox_boot_uuids.stat.exists

- name: Regenerate GRUB configuration
  ansible.builtin.command:
    cmd: update-grub
  changed_when: true  # only runs when the pin drop-in actually changed
  when:
    - not proxmox_boot_uuids.stat.exists
    - grub_kernel_pin.changed

- name: Check current kernel version
  ansible.builtin.command: uname -r
  register: current_kernel
  changed_when: false

- name: Fail if not running kernel 6.14
  ansible.builtin.fail:
    msg: >-
      Running kernel is {{ current_kernel.stdout }}, but the nvidia
      {{ nvidia_driver_version }} DKMS module only builds against 6.14
      ({{ kernel_6_14_version }}). The bootloader is now pinned to 6.14 --
      reboot rohan and re-run this playbook. Until then wyoming-whisper is not
      deployed here and the whisper VIP stays on boromir.
  when: "'6.14' not in current_kernel.stdout"

- name: Add Debian non-free repository
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware"
    state: present
    filename: non-free
    update_cache: false

- name: Install NVIDIA driver and fan control dependencies
  ansible.builtin.apt:
    name:
      - nvidia-driver
      - nvidia-smi
      - nvidia-settings
      - xserver-xorg
      - python3-pip
    state: present
    update_cache: true

- name: Rebuild NVIDIA DKMS module
  ansible.builtin.command:
    cmd: dkms autoinstall
  register: dkms_result
  changed_when: "'Building' in dkms_result.stdout"

- name: Update module dependencies
  ansible.builtin.command:
    cmd: depmod -a
  changed_when: false

- name: Configure NVIDIA modules to load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nvidia.conf
    content: |
      # NVIDIA modules - loaded at boot for GPU support
      nvidia-current
      nvidia-current-modeset
      nvidia-current-drm
      nvidia-current-uvm
    mode: '0644'

- name: Load NVIDIA modules now
  ansible.builtin.shell: |
    modprobe nvidia-current
    modprobe nvidia-current-modeset
    modprobe nvidia-current-drm
    modprobe nvidia-current-uvm
  changed_when: false

- name: Enable nvidia-persistenced
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: started

- name: Install pipx for Python app isolation
  ansible.builtin.apt:
    name: pipx
    state: present

- name: Install coolgpus for headless fan control
  ansible.builtin.command:
    cmd: pipx install coolgpus
    creates: /root/.local/bin/coolgpus
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin

- name: Create coolgpus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/coolgpus.service
    content: |
      [Unit]
      Description=NVIDIA GPU Fan Control (coolgpus)
      After=nvidia-persistenced.service

      [Service]
      Type=simple
      # Fan curve: 25% at 40C, 35% at 50C, 50% at 60C, 70% at 70C, 100% at 80C
      ExecStart=/usr/local/bin/coolgpus --temp 40 50 60 70 80 --speed 25 35 50 70 100
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Restart coolgpus

- name: Enable and start coolgpus
  ansible.builtin.systemd:
    name: coolgpus
    enabled: true
    state: started
    daemon_reload: true
