---
# Keepalived VRRP for Wyoming Whisper with manual Boromir fallback
#
# Sets up Rohan as the MASTER for the Whisper VIP (192.168.1.54).
# Boromir can take over after an operator starts its manual Whisper service.
#
# VIP: 192.168.1.54
# VRRP ID: 54
# Health check: TCP connection to wyoming-whisper on port 10300

- name: Install keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true

- name: Install netcat for health checks
  ansible.builtin.apt:
    name: netcat-openbsd
    state: present

- name: Create keepalived script group
  ansible.builtin.group:
    name: keepalived_script
    system: true

- name: Create keepalived script user
  ansible.builtin.user:
    name: keepalived_script
    group: keepalived_script
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Deploy keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: '0644'
  notify: Restart keepalived

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
