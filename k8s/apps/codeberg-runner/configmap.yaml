apiVersion: v1
kind: ConfigMap
metadata:
  name: codeberg-runner-config
  namespace: codeberg-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /config/.runner
      capacity: 2
      timeout: 3h
      labels:
        # Pinned by digest: act-latest moves upstream and a silent refresh broke CI.
        # Must stay a bare @sha256 ref - the tag@digest form fails to parse.
        # Re-pin deliberately: skopeo inspect --no-tags docker://ghcr.io/catthehacker/ubuntu:act-latest
        - "ubuntu-latest:docker://zot.zot.svc.cluster.local:5000/ghcr.io/catthehacker/ubuntu@sha256:8bbfe9e0da9b403b099a185a6962b9e3fb8d8dd057be3abd2daef2945ffc489e"
    cache:
      enabled: false
    container:
      network: host
      privileged: false
      options: ""
      workdir_parent: /workspace
  daemon.json: |
    {
      "registry-mirrors": ["http://zot.zot.svc.cluster.local:5000"],
      "insecure-registries": ["zot.zot.svc.cluster.local:5000"],
      "mtu": 1400
    }
