---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collie
  namespace: collie
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Authentik outpost path must bypass forwardAuth middleware
    - match: Host(`collie.dimensiondoor.xyz`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: 80
    - match: Host(`collie.dimensiondoor.xyz`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: authentik
      services:
        - name: collie-external
          port: 8788
  tls:
    secretName: collie-tls
