---
# Selectorless service pointing to Collie on aragorn (LAN proxy)
apiVersion: v1
kind: Service
metadata:
  name: collie-external
  namespace: collie
spec:
  ports:
    - name: http
      port: 8788
      targetPort: 8788
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: collie-external
  namespace: collie
  labels:
    kubernetes.io/service-name: collie-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8788
endpoints:
  - addresses:
      - 192.168.1.28
