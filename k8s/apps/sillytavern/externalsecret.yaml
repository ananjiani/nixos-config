---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sillytavern-secrets
  namespace: sillytavern
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sillytavern-secrets
    creationPolicy: Owner
  data:
    - secretKey: deepseek-api-key
      remoteRef:
        key: llm/keys
        property: deepseek-api-key
