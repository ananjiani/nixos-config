---
# Selectorless service pointing to Hermes dashboard on aragorn
apiVersion: v1
kind: Service
metadata:
  name: hermes-external
  namespace: hermes
spec:
  ports:
    - name: http
      port: 9119
      targetPort: 9119
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes-external
  namespace: hermes
  labels:
    kubernetes.io/service-name: hermes-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9119
endpoints:
  - addresses:
      - 192.168.1.28
