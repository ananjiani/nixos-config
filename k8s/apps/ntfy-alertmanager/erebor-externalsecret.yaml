---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-alertmanager-erebor-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ntfy-alertmanager-erebor-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config: |
          http-address :8080
          log-level info
          alert-mode single

          labels {
              order "severity"

              severity "critical" {
                  priority 5
                  tags "rotating_light"
              }

              severity "warning" {
                  priority 3
                  tags "warning"
              }

              severity "info" {
                  priority 2
                  tags "information_source"
              }
          }

          resolved {
              tags "white_check_mark"
              priority 1
          }

          ntfy {
              server https://ntfy.dimensiondoor.xyz
              topic monitoring
              access-token {{ .accessToken }}
          }

          alertmanager {
              url http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
          }

          cache {
              type memory
              duration 24h
              cleanup-interval 1h
          }
  data:
    - secretKey: accessToken
      remoteRef:
        # Deliberately duplicated from the Erebor auth bundle. ESO can read
        # k8s/* but must not receive user hashes or other clients' tokens.
        key: k8s/ntfy-erebor
        property: alertmanager-token
