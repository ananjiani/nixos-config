---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager-erebor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy-alertmanager-erebor
    app.kubernetes.io/instance: erebor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-alertmanager-erebor
      app.kubernetes.io/instance: erebor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-alertmanager-erebor
        app.kubernetes.io/instance: erebor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy-alertmanager
          image: xenrox/ntfy-alertmanager:1.0.1
          args:
            - --config
            - /etc/ntfy-alertmanager/config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy-alertmanager
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: ntfy-alertmanager-erebor-config
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-alertmanager-erebor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy-alertmanager-erebor
    app.kubernetes.io/instance: erebor
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ntfy-alertmanager-erebor
    app.kubernetes.io/instance: erebor
