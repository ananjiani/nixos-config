---
# Headless service pointing at the native NixOS Jellyfin on theoden.
# Mirrors romm/service.yaml (off-cluster via manual Endpoints).
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-external
  namespace: jellyfin
spec:
  ports:
    - port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyfin-external
  namespace: jellyfin
subsets:
  - addresses:
      - ip: 192.168.1.27
    ports:
      - port: 8096
