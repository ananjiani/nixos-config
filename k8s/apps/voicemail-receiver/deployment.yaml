---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicemail-receiver
  namespace: voicemail-receiver
  labels:
    app: voicemail-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicemail-receiver
  template:
    metadata:
      labels:
        app: voicemail-receiver
    spec:
      containers:
        - name: voicemail-receiver
          # Webhook-based voicemail receiver
          # Receives Telnyx webhooks, transcribes via Wyoming Whisper, notifies via ntfy
          # Build from: https://codeberg.org/ananjiani/voicemail-receiver
          image: codeberg.org/ananjiani/voicemail-receiver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: voicemail-config
            - secretRef:
                name: voicemail-secrets
          volumeMounts:
            - name: voicemail-storage
              mountPath: /data/voicemails
              subPath: voicemails  # Creates /srv/nfs/voicemails on theoden
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # App liveness is HTTP-only; storage write health belongs in monitoring, not pod liveness.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
        - name: ntfy-auth-proxy
          image: caddy:2.11.4-alpine
          command:
            - caddy
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          volumeMounts:
            # ExternalSecret rotation needs a controlled rollout because Caddy
            # intentionally runs without its config-revealing admin API.
            - name: ntfy-proxy-config
              mountPath: /etc/caddy
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:2586/_proxy_health
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:2586/_proxy_health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: voicemail-storage
          persistentVolumeClaim:
            claimName: voicemail-data
        - name: ntfy-proxy-config
          secret:
            secretName: voicemail-ntfy-proxy
