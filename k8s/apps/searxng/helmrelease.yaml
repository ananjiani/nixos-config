---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: searxng
spec:
  interval: 1h
  chart:
    spec:
      chart: searxng
      version: "1.0.7"
      sourceRef:
        kind: HelmRepository
        name: kubitodev
        namespace: flux-system
      interval: 1h
  values:
    config:
      # settings.yml comes from the searxng-settings Secret (see
      # externalsecret.yaml) because engine API keys can only live in the
      # settings file, not env vars. secret_key is in there too, replacing
      # the old SEARXNG_SECRET env / plaintext secret.yaml.
      settings:
        enabled: false
      limiter:
        enabled: true
        data: |-
          [botdetection.ip_limit]
          link_token = true
    volumes:
      - name: searxng-settings
        secret:
          secretName: searxng-settings
    volumeMounts:
      - mountPath: /etc/searxng/settings.yml
        name: searxng-settings
        subPath: settings.yml
        readOnly: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: searxng
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: searxng
              spec:
                template:
                  spec:
                    enableServiceLinks: false
                    containers:
                      - name: searxng
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
