---
# Renders the full settings.yml with secrets baked in. SearXNG cannot read
# engine API keys from env vars (only a fixed set of SEARXNG_* server
# settings), so the whole settings file is templated here and mounted over
# the chart's ConfigMap via the HelmRelease volumes/volumeMounts values.
#
# NOTE: the file is mounted with subPath, so key rotation in OpenBao needs a
# `kubectl -n searxng rollout restart deploy/searxng` after ESO re-syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-settings
  namespace: searxng
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: searxng-settings
    creationPolicy: Owner
    template:
      data:
        settings.yml: |
          use_default_settings: true
          server:
            secret_key: "{{ .secretKey }}"
            limiter: false
            image_proxy: true
            method: "GET"
          search:
            formats:
              - html
              - json
            default_lang: "en"
          engines:
            # Brave Search API (not the scraping `brave` engine): immune to
            # the IP-reputation CAPTCHAs that suspend the scrapers when
            # egressing through Mullvad. Free tier ~2k queries/month.
            - name: braveapi
              engine: braveapi
              api_key: "{{ .braveApiKey }}"
              inactive: false
            # Lenient no-key scrapers as backup; rarely CAPTCHA-block VPN IPs.
            - name: qwant
              disabled: false
            - name: mojeek
              disabled: false
  data:
    - secretKey: secretKey
      remoteRef:
        key: k8s/searxng
        property: secret-key
    - secretKey: braveApiKey
      remoteRef:
        key: k8s/searxng
        property: brave-api-key
