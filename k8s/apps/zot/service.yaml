---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: zot
  labels:
    app: zot
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.56"
spec:
  type: LoadBalancer
  ports:
    - port: 5000
      targetPort: 5000
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zot-host
  namespace: zot
  labels:
    kubernetes.io/service-name: zot
    endpointslice.kubernetes.io/managed-by: dimensiondoor.xyz
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5000
endpoints:
  - addresses:
      - 192.168.1.27
    conditions:
      ready: true
---
# Prometheus Operator currently renders ServiceMonitors with Kubernetes
# `role: endpoints`; keep this bridge alongside the EndpointSlice until that
# discovery path is migrated to EndpointSlice.
apiVersion: v1
kind: Endpoints
metadata:
  name: zot
  namespace: zot
  labels:
    app: zot
    endpoints.kubernetes.io/managed-by: dimensiondoor.xyz
    endpointslice.kubernetes.io/skip-mirror: "true"
subsets:
  - addresses:
      - ip: 192.168.1.27
    ports:
      - name: http
        protocol: TCP
        port: 5000
