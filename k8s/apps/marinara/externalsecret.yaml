---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marinara-secrets
  namespace: marinara
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: marinara-secrets
    creationPolicy: Owner
  data:
    - secretKey: encryption-key
      remoteRef:
        key: k8s/marinara
        property: encryption-key
    - secretKey: admin-secret
      remoteRef:
        key: k8s/marinara
        property: admin-secret
    - secretKey: deepseek-api-key
      remoteRef:
        key: llm/keys
        property: deepseek-api-key
