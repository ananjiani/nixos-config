---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marinara
  namespace: marinara
  labels:
    app: marinara
spec:
  replicas: 1
  strategy:
    # Longhorn PVC is ReadWriteOnce, so the old pod must die before the new one starts
    type: Recreate
  selector:
    matchLabels:
      app: marinara
  template:
    metadata:
      labels:
        app: marinara
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: marinara
          image: ghcr.io/pasta-devs/marinara-engine:2.5.1-lite
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /app/data
            - name: FILE_STORAGE_DIR
              value: /app/data/storage
            - name: MARINARA_DOCKER
              value: "true"
            - name: AUTO_OPEN_BROWSER
              value: "false"
            - name: AUTO_UPDATE_ENABLED
              value: "false"
            - name: AUTO_CREATE_DEFAULT_CONNECTION
              value: "false"
            - name: TRUSTED_HOSTS
              value: marinara.dimensiondoor.xyz
            - name: CORS_ORIGINS
              value: https://marinara.dimensiondoor.xyz
            - name: CSRF_TRUSTED_ORIGINS
              value: https://marinara.dimensiondoor.xyz
            - name: ALLOW_UNAUTHENTICATED_PRIVATE_NETWORK
              value: "true"
            - name: ALLOW_UNAUTHENTICATED_REMOTE
              value: "false"
            - name: BYPASS_AUTH_TAILSCALE
              value: "false"
            - name: BYPASS_AUTH_DOCKER
              value: "false"
            # The admin-proxy sidecar forwards from 127.0.0.1; keep the 2.4 auth behavior for it.
            - name: REQUIRE_AUTH_FOR_LOOPBACK_PROXY
              value: "false"
            - name: LOG_LEVEL
              value: warn
            - name: TZ
              value: America/Chicago
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: marinara-secrets
                  key: encryption-key
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: marinara-secrets
                  key: admin-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    lease="${FILE_STORAGE_DIR:-/app/data/storage}/.writer-lease"
                    kill -TERM 1

                    while [ -e "$lease" ]; do
                      sleep 1
                    done

                    # Do not return while PID 1 can forward kubelet's normal
                    # post-hook SIGTERM to an already-shutting-down server.
                    while kill -0 1 2>/dev/null; do
                      sleep 1
                    done
        - name: admin-proxy
          image: caddy:2.11.4-alpine
          ports:
            - name: proxy
              containerPort: 7861
              protocol: TCP
          env:
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: marinara-secrets
                  key: admin-secret
          volumeMounts:
            - name: admin-proxy
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: proxy
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marinara-data
        - name: admin-proxy
          configMap:
            name: marinara-admin-proxy
