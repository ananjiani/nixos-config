---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internet-archive-addon
  namespace: stremio
  labels:
    app: internet-archive-addon
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: internet-archive-addon
  template:
    metadata:
      labels:
        app: internet-archive-addon
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: addon
          image: gcr.io/distroless/nodejs24-debian13:nonroot@sha256:cb606325b7ec4af55462cb0b424a53b452a5b4a894ffe841fcf1048d216fb9f8
          imagePullPolicy: IfNotPresent
          args:
            - /app/app.js
          env:
            - name: PORT
              value: "7000"
          ports:
            - name: http
              containerPort: 7000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: application
              mountPath: /app
              readOnly: true
      volumes:
        - name: application
          configMap:
            name: internet-archive-addon
