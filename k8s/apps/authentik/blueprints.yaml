  collie.yaml: |
    # Forward-auth apps via Authentik embedded outpost
    version: 1
    metadata:
      name: Forward auth apps
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: collie-provider
        identifiers:
          name: Collie
        attrs:
          name: Collie
          mode: forward_single
          external_host: https://collie.dimensiondoor.xyz
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: collie-app
        identifiers:
          slug: collie
        attrs:
          name: Collie
          slug: collie
          provider: !KeyOf collie-provider
          meta_launch_url: https://collie.dimensiondoor.xyz
          policy_engine_mode: any

      - model: authentik_providers_proxy.proxyprovider
        id: sillytavern-provider
        identifiers:
          name: SillyTavern
        attrs:
          name: SillyTavern
          mode: forward_single
          external_host: https://sillytavern.dimensiondoor.xyz
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: sillytavern-app
        identifiers:
          slug: sillytavern
        attrs:
          name: SillyTavern
          slug: sillytavern
          provider: !KeyOf sillytavern-provider
          meta_launch_url: https://sillytavern.dimensiondoor.xyz
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf sillytavern-app
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]

      - model: authentik_providers_proxy.proxyprovider
        id: marinara-provider
        identifiers:
          name: Marinara
        attrs:
          name: Marinara
          mode: forward_single
          external_host: https://marinara.dimensiondoor.xyz
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: marinara-app
        identifiers:
          slug: marinara
        attrs:
          name: Marinara
          slug: marinara
          provider: !KeyOf marinara-provider
          meta_launch_url: https://marinara.dimensiondoor.xyz
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf marinara-app
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]

      # Single blueprint owns the embedded outpost provider list so every
      # forward-auth provider can use !KeyOf (no cross-blueprint !Find).
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf collie-provider
            - !KeyOf sillytavern-provider
            - !KeyOf marinara-provider
