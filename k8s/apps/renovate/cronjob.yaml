---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 5 * * *" # Daily 5am (matches renovate.json schedule)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:full@sha256:3dd7dff3906de73d7dcfef3216c04e06b030579c7cd33cadb9129d54996645ce
              env:
                # Dynamically install manager-specific tools that are not bundled
                # in renovate:full, such as the Flux CLI used to regenerate
                # k8s/flux-system/gotk-components.yaml.
                - name: RENOVATE_BINARY_SOURCE
                  value: "install"
                - name: RENOVATE_PLATFORM
                  value: "forgejo"
                - name: RENOVATE_ENDPOINT
                  value: "https://codeberg.org"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-credentials
                      key: token
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate <ananjiani@noreply.codeberg.org>"
                - name: RENOVATE_REPOSITORIES
                  value: "ananjiani/infra"
                - name: LOG_LEVEL
                  value: "info"
                # GitHub token for fetching release notes from GitHub-hosted deps
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-credentials
                      key: github-token
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          restartPolicy: OnFailure
