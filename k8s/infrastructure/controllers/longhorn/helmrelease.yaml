---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      # Pin schema-sensitive chart values; review upgrades explicitly.
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    defaultSettings:
      # Replicate data across all 3 nodes for full HA
      defaultReplicaCount: 3
      # Use less aggressive resource settings for homelab
      guaranteedInstanceManagerCPU: 5
      # Protect the shared control-plane disks from rebuild I/O storms.
      concurrentReplicaRebuildPerNodeLimit: 1
      # Automatically remove stale replica data after a one-hour recovery window.
      orphanResourceAutoDeletion: replica-data
      orphanResourceAutoDeletionGracePeriod: 3600
      # Faster failover: delete pods when node goes down (instead of waiting for k8s)
      nodeDownPodDeletionPolicy: delete-statefulset-pod
    # Longhorn 1.12 manages the BackupTarget CR through defaultBackupStore,
    # rather than the legacy defaultSettings keys.
    defaultBackupStore:
      backupTarget: "s3://ammars-homelab-offsite@us-east-005/longhorn/"
      backupTargetCredentialSecret: longhorn-backup
      pollInterval: 300
    metrics:
      serviceMonitor:
        enabled: true
    persistence:
      # Make Longhorn the default storage class
      defaultClass: true
      defaultClassReplicaCount: 3
