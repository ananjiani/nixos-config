---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "42.3.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Service configuration - use MetalLB LoadBalancer
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "192.168.1.52"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

    # Ports configuration (v39+ schema)
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
        # Redirect HTTP to HTTPS
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true
        transport:
          respondingTimeouts:
            readTimeout: 600s

    # Enable Traefik dashboard (internal only)
    ingressRoute:
      dashboard:
        enabled: false  # We'll create our own if needed

    # Resource limits for homelab
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # Logs (chart 41.x renamed: logs.general -> log, logs.access -> accessLog)
    log:
      level: INFO
    accessLog:
      enabled: true

    # Providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
